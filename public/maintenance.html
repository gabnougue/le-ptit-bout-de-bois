<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le P'tit Bout de Bois - En Construction</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: #fdfbf7;
            color: #2c1810;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(#e6dacc 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(44, 24, 16, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeIn 1s ease-out;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 40px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.08));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-weight: 700;
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #5c3a21 0%, #a67c52 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #6d5e53;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .loader-bar {
            width: 60px;
            height: 4px;
            background: #eee;
            border-radius: 4px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #8b5a36, transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .logo {
                max-width: 180px;
            }
        }
    </style>
</head>

<body>
    <div class="background-pattern"></div>
    <div class="container">
        <img src="/ptitboutdebois-maintenance.jpg" alt="Le P'tit Bout de Bois" class="logo">
        <h1>Bientôt Disponible</h1>
        <p>Nous façonnons actuellement notre nouvelle boutique en ligne.<br>Revenez très vite pour découvrir nos
            créations.</p>
        <div class="loader-bar"></div>
    </div>
</body>

</html>
